<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SWG Consulting | Medicina e Segurança do Trabalho</title>
<style>
  :root {
    --primary: #0a2342;
    --secondary: #1565c0;
    --accent: #00bcd4;
    --accent2: #43a047;
    --light: #f4f8fb;
    --white: #ffffff;
    --gray: #6b7280;
    --gray-light: #e8eef4;
    --text: #1a2332;
    --shadow: 0 4px 32px rgba(10,35,66,0.10);
    --radius: 14px;
    --transition: 0.35s cubic-bezier(.4,0,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background: var(--white);
    overflow-x: hidden;
  }
  img { max-width: 100%; display: block; }
  a { text-decoration: none; color: inherit; }
  ul { list-style: none; }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 7px; }
  ::-webkit-scrollbar-track { background: var(--light); }
  ::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }

  /* NAV */
  nav {
    position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
    background: rgba(10,35,66,0.97);
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 24px rgba(10,35,66,0.18);
    transition: var(--transition);
  }
  .nav-inner {
    max-width: 1200px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 28px; height: 70px;
  }
  .logo {
    display: flex; align-items: center; gap: 12px;
  }
  .logo-icon {
    width: 42px; height: 42px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--secondary));
    display: flex; align-items: center; justify-content: center;
  }
  .logo-icon svg { width: 24px; height: 24px; }
  .logo-text { font-size: 1.22rem; font-weight: 700; color: var(--white); letter-spacing: 0.5px; }
  .logo-text span { color: var(--accent); }
  .nav-links {
    display: flex; align-items: center; gap: 6px;
  }
  .nav-links a {
    color: rgba(255,255,255,0.85); font-size: 0.95rem; font-weight: 500;
    padding: 8px 16px; border-radius: 8px;
    transition: var(--transition);
  }
  .nav-links a:hover { color: var(--accent); background: rgba(0,188,212,0.10); }
  .nav-cta {
    background: linear-gradient(90deg, var(--accent), var(--secondary));
    color: var(--white) !important;
    padding: 9px 22px !important;
    border-radius: 8px !important;
    font-weight: 600 !important;
    box-shadow: 0 2px 12px rgba(0,188,212,0.25);
    transition: var(--transition) !important;
  }
  .nav-cta:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,188,212,0.35) !important; }
  .hamburger {
    display: none; flex-direction: column; gap: 5px; cursor: pointer;
    background: none; border: none; padding: 6px;
  }
  .hamburger span {
    display: block; width: 26px; height: 2.5px;
    background: var(--white); border-radius: 4px;
    transition: var(--transition);
  }
  .hamburger.active span:nth-child(1) { transform: translateY(7.5px) rotate(45deg); }
  .hamburger.active span:nth-child(2) { opacity: 0; }
  .hamburger.active span:nth-child(3) { transform: translateY(-7.5px) rotate(-45deg); }
  .mobile-menu {
    display: none; flex-direction: column; gap: 4px;
    background: rgba(10,35,66,0.99);
    padding: 16px 20px 20px;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a {
    color: rgba(255,255,255,0.85); font-size: 1rem; font-weight: 500;
    padding: 12px 14px; border-radius: 8px;
    transition: var(--transition);
  }
  .mobile-menu a:hover { color: var(--accent); background: rgba(0,188,212,0.10); }

  /* HERO */
  .hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #0a2342 0%, #0d3060 50%, #0a4080 100%);
    display: flex; align-items: center;
    position: relative; overflow: hidden;
    padding-top: 70px;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%2300bcd4' fill-opacity='0.04'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  }
  .hero-particles {
    position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  }
  .particle {
    position: absolute; border-radius: 50%;
    background: rgba(0,188,212,0.15);
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-100px) scale(1); opacity: 0; }
  }
  .hero-inner {
    max-width: 1200px; margin: 0 auto; padding: 60px 28px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center;
    position: relative; z-index: 2;
  }
  .hero-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(0,188,212,0.15); border: 1px solid rgba(0,188,212,0.3);
    color: var(--accent); font-size: 0.82rem; font-weight: 600;
    padding: 6px 16px; border-radius: 50px; margin-bottom: 22px;
    letter-spacing: 0.5px; text-transform: uppercase;
  }
  .hero-badge::before {
    content: ''; width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent); animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }
  .hero h1 {
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 800; color: var(--white);
    line-height: 1.18; margin-bottom: 20px;
  }
  .hero h1 span { color: var(--accent); }
  .hero p {
    font-size: 1.08rem; color: rgba(255,255,255,0.78);
    line-height: 1.75; margin-bottom: 36px;
  }
  .hero-btns { display: flex; gap: 14px; flex-wrap: wrap; }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(90deg, var(--accent), #0097a7);
    color: var(--white); font-size: 1rem; font-weight: 700;
    padding: 14px 30px; border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,188,212,0.35);
    transition: var(--transition); cursor: pointer; border: none;
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,188,212,0.45); }
  .btn-secondary {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; color: var(--white);
    border: 2px solid rgba(255,255,255,0.3);
    font-size: 1rem; font-weight: 600;
    padding: 13px 28px; border-radius: 10px;
    transition: var(--transition); cursor: pointer;
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-3px); }
  .hero-stats {
    display: flex; gap: 28px; margin-top: 44px; flex-wrap: wrap;
  }
  .stat-item { text-align: center; }
  .stat-num {
    font-size: 2rem; font-weight: 800; color: var(--accent);
    display: block; line-height: 1;
  }
  .stat-label { font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-top: 4px; }
  .hero-visual {
    display: flex; justify-content: center; align-items: center;
  }
  .hero-card-wrap {
    position: relative; width: 380px; max-width: 100%;
  }
  .hero-main-card {
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.13);
    border-radius: 24px;
    padding: 36px;
    backdrop-filter: blur(12px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .hero-card-icon {
    width: 64px; height: 64px; border-radius: 16px;
    background: linear-gradient(135deg, var(--accent), var(--secondary));
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 20px;
  }
  .hero-card-icon svg { width: 34px; height: 34px; }
  .hero-main-card h3 { color: var(--white); font-size: 1.25rem; font-weight: 700; margin-bottom: 10px; }
  .hero-main-card p { color: rgba(255,255,255,0.65); font-size: 0.92rem; line-height: 1.6; }
  .floating-badge {
    position: absolute;
    background: var(--white);
    border-radius: 14px;
    padding: 12px 18px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    display: flex; align-items: center; gap: 10px;
  }
  .floating-badge.top { top: -20px; right: -20px; }
  .floating-badge.bottom { bottom: -20px; left: -20px; }
  .floating-badge .badge-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .badge-icon.green { background: rgba(67,160,71,0.15); }
  .badge-icon.blue { background: rgba(21,101,192,0.15); }
  .floating-badge .badge-text { font-size: 0.8rem; }
  .badge-title { font-weight: 700; color: var(--text); font-size: 0.88rem; }
  .badge-sub { color: var(--gray); font-size: 0.76rem; }
  .hero-scroll {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    color: rgba(255,255,255,0.5); font-size: 0.78rem; cursor: pointer;
  }
  .scroll-line {
    width: 1.5px; height: 40px;
    background: linear-gradient(to bottom, transparent, rgba(0,188,212,0.6));
    animation: scrollLine 2s ease-in-out infinite;
  }
  @keyframes scrollLine { 0%,100%{opacity:0.4;transform:scaleY(0.7)} 50%{opacity:1;transform:scaleY(1)} }

  /* SECTION BASE */
  section { padding: 90px 0; }
  .container { max-width: 1200px; margin: 0 auto; padding: 0 28px; }
  .section-tag {
    display: inline-block; background: rgba(0,188,212,0.10);
    color: var(--secondary); font-size: 0.78rem; font-weight: 700;
    padding: 5px 16px; border-radius: 50px; text-transform: uppercase;
    letter-spacing: 1px; margin-bottom: 14px;
    border: 1px solid rgba(21,101,192,0.15);
  }
  .section-title {
    font-size: clamp(1.7rem, 3vw, 2.5rem);
    font-weight: 800; color: var(--primary); line-height: 1.2;
    margin-bottom: 16px;
  }
  .section-title span { color: var(--secondary); }
  .section-desc { font-size: 1.05rem; color: var(--gray); line-height: 1.75; max-width: 580px; }
  .section-header { margin-bottom: 56px; }
  .section-header.center { text-align: center; }
  .section-header.center .section-desc { margin: 0 auto; }

  /* NÚMEROS / DIFERENCIAIS */
  .numbers-section {
    background: linear-gradient(135deg, var(--primary), #0d3060);
    padding: 60px 0;
  }
  .numbers-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 30px;
  }
  .number-item {
    text-align: center; padding: 30px 20px;
    border-right: 1px solid rgba(255,255,255,0.08);
  }
  .number-item:last-child { border-right: none; }
  .number-val {
    font-size: 2.8rem; font-weight: 800; color: var(--accent);
    display: block; line-height: 1;
  }
  .number-label { color: rgba(255,255,255,0.7); font-size: 0.92rem; margin-top: 8px; }

  /* SERVIÇOS */
  .services-section { background: var(--light); }
  .services-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;
  }
  .service-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 36px 30px;
    box-shadow: var(--shadow);
    transition: var(--transition);
    position: relative; overflow: hidden;
    border: 1px solid transparent;
  }
  .service-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--accent), var(--secondary));
    transform: scaleX(0); transform-origin: left;
    transition: var(--transition);
  }
  .service-card:hover { transform: translateY(-8px); box-shadow: 0 20px 50px rgba(10,35,66,0.16); border-color: rgba(0,188,212,0.15); }
  .service-card:hover::before { transform: scaleX(1); }
  .service-icon {
    width: 62px; height: 62px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 22px; transition: var(--transition);
  }
  .service-card:hover .service-icon { transform: scale(1.1); }
  .service-icon.blue { background: rgba(21,101,192,0.10); }
  .service-icon.teal { background: rgba(0,188,212,0.10); }
  .service-icon.green { background: rgba(67,160,71,0.10); }
  .service-icon.orange { background: rgba(255,152,0,0.10); }
  .service-icon.purple { background: rgba(103,58,183,0.10); }
  .service-icon.red { background: rgba(229,57,53,0.10); }
  .service-icon svg { width: 30px; height: 30px; }
  .service-card h3 { font-size: 1.15rem; font-weight: 700; color: var(--primary); margin-bottom: 12px; }
  .service-card p { font-size: 0.93rem; color: var(--gray); line-height: 1.7; margin-bottom: 20px; }
  .service-link {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--secondary); font-size: 0.9rem; font-weight: 600;
    transition: var(--transition);
  }
  .service-link:hover { gap: 10px; color: var(--accent); }
  .service-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
  .service-tag {
    font-size: 0.74rem; font-weight: 600; padding: 3px 10px;
    border-radius: 50px; background: var(--gray-light); color: var(--gray);
  }

  /* SOBRE */
  .about-section { background: var(--white); }
  .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 70px; align-items: center; }
  .about-visual { position: relative; }
  .about-img-wrap {
    border-radius: 24px; overflow: hidden;
    background: linear-gradient(135deg, #0a2342, #1565c0);
    padding: 50px 40px; position: relative;
    box-shadow: 0 20px 60px rgba(10,35,66,0.2);
  }
  .about-img-icon {
    display: flex; justify-content: center; margin-bottom: 30px;
  }
  .about-img-icon .big-icon {
    width: 100px; height: 100px; border-radius: 50%;
    background: rgba(0,188,212,0.15); border: 3px solid rgba(0,188,212,0.3);
    display: flex; align-items: center; justify-content: center;
  }
  .about-img-icon svg { width: 52px; height: 52px; }
  .about-feature-list { display: flex; flex-direction: column; gap: 14px; }
  .about-feature {
    display: flex; align-items: center; gap: 14px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px 18px;
  }
  .about-feature .feat-icon {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(0,188,212,0.2); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .about-feature .feat-icon svg { width: 18px; height: 18px; }
  .about-feature span { color: rgba(255,255,255,0.85); font-size: 0.92rem; font-weight: 500; }
  .about-badge-float {
    position: absolute; bottom: -20px; right: -20px;
    background: var(--white); border-radius: 16px;
    padding: 16px 22px; box-shadow: 0 10px 40px rgba(10,35,66,0.18);
    display: flex; align-items: center; gap: 14px;
  }
  .about-badge-float .ab-icon {
    width: 46px; height: 46px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent2), #2e7d32);
    display: flex; align-items: center; justify-content: center;
  }
  .about-badge-float .ab-icon svg { width: 24px; height: 24px; }
  .about-badge-float .ab-text .ab-num { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
  .about-badge-float .ab-text .ab-label { font-size: 0.78rem; color: var(--gray); }
  .about-content .section-desc { max-width: 100%; margin-bottom: 28px; }
  .about-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 34px; }
  .about-list-item {
    display: flex; align-items: flex-start; gap: 14px;
    padding: 16px 18px; border-radius: 12px;
    background: var(--light); border-left: 3px solid var(--accent);
    transition: var(--transition);
  }
  .about-list-item:hover { background: rgba(0,188,212,0.06); }
  .about-list-item .check {
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(67,160,71,0.15); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    margin-top: 1px;
  }
  .about-list-item .check svg { width: 14px; height: 14px; }
  .about-list-item .item-text h4 { font-size: 0.95rem; font-weight: 700; color: var(--primary); margin-bottom: 3px; }
  .about-list-item .item-text p { font-size: 0.86rem; color: var(--gray); line-height: 1.5; }

  /* POR QUE NÓS */
  .why-section { background: var(--light); }
  .why-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; }
  .why-card {
    background: var(--white); border-radius: var(--radius);
    padding: 32px 24px; text-align: center;
    box-shadow: var(--shadow); transition: var(--transition);
    border: 1px solid transparent;
  }
  .why-card:hover { transform: translateY(-6px); border-color: rgba(0,188,212,0.2); }
  .why-icon {
    width: 68px; height: 68px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, rgba(0,188,212,0.12), rgba(21,101,192,0.12));
    transition: var(--transition);
  }
  .why-card:hover .why-icon { background: linear-gradient(135deg, var(--accent), var(--secondary)); }
  .why-card:hover .why-icon svg path, .why-card:hover .why-icon svg circle,
  .why-card:hover .why-icon svg rect, .why-card:hover .why-icon svg polyline,
  .why-card:hover .why-icon svg line { stroke: white !important; }
  .why-icon svg { width: 30px; height: 30px; }
  .why-card h3 { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
  .why-card p { font-size: 0.88rem; color: var(--gray); line-height: 1.65; }

  /* PROCESSO */
  .process-section { background: var(--white); }
  .process-steps {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 0;
    position: relative;
  }
  .process-steps::before {
    content: '';
    position: absolute; top: 36px; left: 12.5%; right: 12.5%;
    height: 2px; background: linear-gradient(90deg, var(--accent), var(--secondary));
    z-index: 0;
  }
  .process-step { text-align: center; padding: 0 16px; position: relative; z-index: 1; }
  .step-num {
    width: 72px; height: 72px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--secondary));
    color: var(--white); font-size: 1.4rem; font-weight: 800;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px; box-shadow: 0 6px 24px rgba(0,188,212,0.3);
    transition: var(--transition);
  }
  .process-step:hover .step-num { transform: scale(1.1); }
  .process-step h3 { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 10px; }
  .process-step p { font-size: 0.87rem; color: var(--gray); line-height: 1.6; }

  /* CONTATO */
  .contact-section { background: var(--light); }
  .contact-grid { display: grid; grid-template-columns: 1fr 1.4fr; gap: 56px; align-items: start; }
  .contact-info { display: flex; flex-direction: column; gap: 22px; }
  .contact-card {
    background: var(--white); border-radius: var(--radius);
    padding: 24px; display: flex; align-items: flex-start; gap: 16px;
    box-shadow: var(--shadow); transition: var(--transition);
  }
  .contact-card:hover { transform: translateX(6px); }
  .contact-card-icon {
    width: 50px; height: 50px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .contact-card-icon.teal { background: rgba(0,188,212,0.12); }
  .contact-card-icon.blue { background: rgba(21,101,192,0.12); }
  .contact-card-icon.green { background: rgba(67,160,71,0.12); }
  .contact-card-icon svg { width: 24px; height: 24px; }
  .contact-card h4 { font-size: 0.88rem; font-weight: 600; color: var(--gray); margin-bottom: 4px; }
  .contact-card p { font-size: 1rem; font-weight: 700; color: var(--primary); }
  .contact-card a { color: var(--secondary); font-weight: 700; font-size: 1rem; transition: var(--transition); }
  .contact-card a:hover { color: var(--accent); }
  .contact-form-wrap {
    background: var(--white); border-radius: 20px;
    padding: 40px; box-shadow: var(--shadow);
  }
  .contact-form-wrap h3 { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
  .contact-form-wrap p { color: var(--gray); font-size: 0.92rem; margin-bottom: 28px; }
  .form-group { margin-bottom: 18px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  label { display: block; font-size: 0.86rem; font-weight: 600; color: var(--primary); margin-bottom: 7px; }
  input, textarea, select {
    width: 100%; padding: 13px 16px;
