<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Preview DEV SWG</title>
<style>
html,body{margin:0;padding:0;min-height:100%;background:#fff}
#fallback{min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;color:#333;text-align:center;padding:32px}
</style>
</head>
<body>
<div id="fallback"><div><h1>Carregando preview...</h1><p>Se esta mensagem continuar aparecendo, gere o site novamente.</p></div></div>
<script>
(function(){
  const html = localStorage.getItem("dev_swg_current_generated_html");
  if(!html){
    document.getElementById("fallback").innerHTML = "<div><h1>Nenhum site encontrado</h1><p>Volte ao DEV SWG e clique em Gerar Site com IA.</p></div>";
    return;
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
